<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <circle cx="268" cy="212" r="300" fill="#ffffff" opacity="0.08"/>
  <circle cx="820" cy="880" r="240" fill="#ffffff" opacity="0.06"/>

  <!-- 图片卡片 -->
  <g transform="rotate(-7 287 507)" filter="url(#soft)">
    <rect x="132" y="352" width="310" height="310" rx="44" fill="#ffffff"/>
    <circle cx="222" cy="442" r="32" fill="#fbbf24"/>
    <path d="M164 610 L252 500 L306 566 L346 518 L410 610 Z" fill="#6366f1"/>
  </g>

  <!-- 转换箭头 -->
  <g stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M470 512 H 520"/>
    <path d="M500 468 L 552 512 L 500 556"/>
  </g>

  <!-- 代码卡片 -->
  <g transform="rotate(7 737 507)" filter="url(#soft)">
    <rect x="582" y="352" width="310" height="310" rx="44" fill="#ffffff"/>
    <g stroke="#7c3aed" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M700 452 L652 512 L700 572"/>
      <path d="M774 452 L822 512 L774 572"/>
      <path d="M752 436 L722 588"/>
    </g>
  </g>
</svg>
